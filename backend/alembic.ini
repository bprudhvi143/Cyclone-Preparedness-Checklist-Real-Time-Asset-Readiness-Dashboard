# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, space-separated, other paths to include
# prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max characters of slug to include in file name
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow empty revisions to be created
# and written to the script directory
# allow_empty_revisions = false

# version locations.  defaults to alembic/versions.
# version_locations = %(here)s/alembic/versions

# the database URL is read dynamically in env.py from settings.DATABASE_URL
sqlalchemy.url = postgresql://gvmc_admin:gvmc_secure_pass_2026@localhost/gvmc_disaster_db

[post_write_hooks]
# hooks executed after writing new migration revisions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
